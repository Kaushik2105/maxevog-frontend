<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://res.cloudinary.com/dtyodrnjg/image/upload/v1789240920/cad0234d-7753-4e53-b919-421875a6387b_ttzjvc.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>maxEvoG | Next-Gen Public Recruitment & Application Assistance</title>
    <meta name="description" content="Transparent, deadline-guaranteed public recruitment explorer & 1-on-1 guided application assistance platform. No credential sharing, zero missed deadlines." />
    <!-- Typography: Inter and Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Immediate OAuth Popup Token Dispatcher
      if (window.opener && window.location.hash && (window.location.hash.indexOf('access_token=') !== -1 || window.location.hash.indexOf('id_token=') !== -1)) {
        try {
          var hashParams = new URLSearchParams(window.location.hash.substring(1));
          window.opener.postMessage({
            type: 'MAXEVOG_GOOGLE_AUTH_TOKEN',
            payload: {
              accessToken: hashParams.get('access_token'),
              idToken: hashParams.get('id_token')
            }
          }, window.location.origin);
          window.close();
        } catch (e) {}
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
